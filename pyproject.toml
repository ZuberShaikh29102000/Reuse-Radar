[project]
name = "reuse-radar"
version = "0.1.0"
description = "Detects reusable HEP data products that never reached HEPData."
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<6",
    "fastembed>=0.5",
    "httpx>=0.27",
    "opentelemetry-api>=1.25",
    "pgvector>=0.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest-django>=4.9",
    "django-stubs>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reuse_radar"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["reuse_radar/api/migrations"]  # generated by Django

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Django's `class Meta` lists (indexes, constraints) are the framework's idiom, not shared state.
"reuse_radar/api/models.py" = ["RUF012"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]

[[tool.mypy.overrides]]
module = ["fastembed.*", "pgvector.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "reuse_radar.api.settings"

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "reuse_radar.api.settings"
