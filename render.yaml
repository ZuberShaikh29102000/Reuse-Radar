# Render Blueprint for the read-only API (free plan). See docs/deploy.md for the full checklist.
# Secrets are never committed: values marked `sync: false` are entered in the Render dashboard.
services:
  - type: web
    name: reuse-radar-api
    runtime: python
    plan: free
    # The web service needs no ML libraries: the `pipeline` extra (fastembed) is not installed.
    buildCommand: pip install uv && uv sync --locked --no-dev
    # Single free instance, so migrating at start-up is safe.
    startCommand: >-
      .venv/bin/python manage.py migrate --noinput &&
      .venv/bin/gunicorn reuse_radar.api.wsgi:application
      --bind 0.0.0.0:$PORT --workers 2 --timeout 30 --access-logfile -
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false # Supabase/Neon connection string, with ?sslmode=require
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false # the Cloudflare Pages URL of the frontend (Phase 6)
      - key: API_RATE_LIMIT
        value: 120/min
